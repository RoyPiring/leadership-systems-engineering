- slug: household-privacy-audit
  axis_scores:
    technical_depth: 7
    voice: 9
    validation: 8
  axis_reasoning:
    technical_depth: 'The deepest of the seven practice systems, because it builds something rather than
      only deciding something. A two-record model separates a complete local audit record, holding settings,
      sources, observation clocks, fixture proof, export status and chat counts beside the consent log, from
      a redacted copy that is the only version eligible to leave the laptop. Consent is structured as a
      five-row table keyed on role rather than name, which lowers the identifying detail the audit itself
      has to store. The findings sit in a four-column table tying each setting to its state, its evidence
      and the decision it produced, with observed settings held apart from actions that are pending or
      deliberately not taken.'
    voice: 'It declines the claim the title invites. The record states that a control reduces one defined
      risk rather than making the account private, that plan type and default behavior are not evidence of
      any level of household privacy, and that the conclusion is limited to what a line-by-line review
      showed about one copy. The export is recorded as pending and its contents are explicitly not
      described before it arrives. The absent household member is marked as having consented to nothing,
      with absence stated as not counting as approval, which is the harder reading and the right one.'
    validation: 'The fixture is a real executed experiment, not a description of one. An invented pet and
      an invented town carry no household information, so the boundary can be tested without risking a
      family detail. Deleting the chat removed it from past-chat search at 11:06 PM while the separate
      Memory topic still returned the invented town; deleting that topic changed the answer to I do not
      know at 11:11 PM. Two timestamped observations isolate chat deletion from Memory deletion and prove a
      behavior most users would assume works the other way. All 99 lines of the shareable copy were then
      read for household information before it was allowed out, and the required proof categories were
      confirmed still present after redaction.'
  average: 8.0
  rationale: Deleting the chat left the Memory topic answering; only deleting both reached I do not know
  featured: true
- slug: strategic-bet-drill
  axis_scores:
    technical_depth: 8
    voice: 9
    validation: 7
  axis_reasoning:
    technical_depth: 'Engineering-grade drill design: principles.md governing runtime, four ADRs (persona
      configuration, iterative refusal rules, resource-allocation tests, dependency workflow), an agent
      topology in Mermaid, ten Linear tickets, a four-persona boot prompt, eight phased prompts, a per-step
      rubric plus a capstone scorecard with hard-fail Items 3 and 5, three worksheets, a seven-field brief
      template, and a 30/90-day re-score loop that treats reverted allocation as strategy failure. The
      diagram names all of it. Held at 8 because the ADR contents are named, not shown, and the deliverable
      is prompts and rubrics.'
    voice: 'Sharpest writing in the lens: ''A plan that funds every option is not a bet. It is a delay
      with better formatting.'' and ''The rules set the floor. The rubric judges what clears it.'' Concrete
      decisions and their costs are named throughout. The closing reflections drift into generic tool
      lists, which is the only thing between it and a 10.'
    validation: 'The drill ran: capstone scored 8 of 12, both refusal rules fired (Phase 3 rejected the
      execute-faster diagnosis, Phase 5 rejected efficiency-gains funding), the enterprise desk and SMB
      acquisition were named as what stops, and the human cost is a named person (Marcus T., VP Sales)
      with his hires. Screenshots per phase including the GitHub ship. The 30/90-day re-score is designed
      but not yet run.'
  average: 8.0
  rationale: Refusal rules that force a funded kill decision with the human cost named
  featured: true
- slug: governed-ai-risk-notebook
  axis_scores:
    technical_depth: 7
    voice: 8
    validation: 8
  axis_reasoning:
    technical_depth: 'A governed Claude Project notebook rather than a page: a three-document packet
      (Project Instructions, Entry Template, Entries log) with permanent rules held apart from entries,
      matching PDFs in a local folder and in Project knowledge, four instruction categories checked line
      by line against verbatim never lines and a consent rule, an exact-output fresh-chat fixture whose
      pass condition was binary before the run, a prediction written before Claude could inspect the
      fixture with a rule that a wrong one is logged as a hint used, a replacement PDF proven byte-identical
      by normalized text comparison and the same binary upload, and 11-point and 27-point scripted
      checklists over the packet. More machinery than its two siblings; held at 7 because the runtime is
      still documents plus one model under instructions, and the risk the notebook exists for has not
      been investigated yet.'
    voice: 'Disciplined first person that bounds every claim: the usage percentages document context but
      do not prove correctness, synchronization proves consistency while the judgment stays unproven, a
      planned check is not a completed safeguard, and the three founding questions are left unanswered
      on purpose. The last phase, refusing to add a fifth section after the final pass, is the most
      distinctive line in the lens. Held at 8 because the byte-identical claim and the judgment-not-proven
      caveat each recur across phases 4, 5 and the reflection, and the second-person headings (Confirming
      your starting point, Adding your own dated entry) sit against the first-person prose.'
    validation: 'Five screenshots across six phases and a countable result at nearly every step: a
      four-line founding note in an otherwise empty workspace, three boundary lines returned character
      for character under a pass rule fixed in advance, a text comparison returning True, an 11-point
      checklist and then a 27-item checklist reported all passing, three PDFs local and three items in
      the Project, a two-page preview with the authorship line on page one. The prediction-before-check
      protocol and the no-hint record are the do-not-trust-the-confident-answer reflex made procedural.
      Held at 8 because every check passed and no failing case was exercised; the fixture names what a
      failure would look like but never produces one.'
  average: 7.67
  rationale: A Claude Project notebook whose fixture pass rule and proof prediction were fixed before the run
  featured: true
- slug: stranger-checkable-goals
  axis_scores:
    technical_depth: 7
    voice: 9
    validation: 7
  axis_reasoning:
    technical_depth: 'For the lens question this is the right shape: a Notion page with a frozen baseline
      block, a three-condition scorer, an owner-date-count rule, a HARD marker, a seven-line tracking
      block, a single four-of-five threshold with a one-directional reminder clause, a trigger chosen
      against three rejected alternatives, a scheduled 66-day review, and an evidence standard for objections.
      Every rule is justified by the failure it prevents (hindsight edits, moved thresholds, reminder
      dependence, too-easy goals) and the diagram encodes that reasoning on its edges. It stays at 7 because
      the system is one page plus a calendar across five phases, with no reusable template or tracking
      log, and the review loop that would close it has not run.'
    voice: 'Disciplined first-person prose where nearly every sentence carries a fact or a rule: ''a number
      without a due date could show scale but could not establish lateness'', ''the noon meal was not
      proof that I would follow through, and the calendar did not contain compliance data''. It bounds
      its own claims honestly (the page does not guarantee completion; checkability is not difficulty).
      No banned verbs, no dashes. Held at 9 rather than 10 because the HARD marker and seven-line block
      are described twice across adjacent subsections and the register is uniform rather than distinctive.'
    validation: 'Each of five phases has a screenshot and a concrete result: a 0 of 9 baseline with component
      counts (four had a number, five a specific action, none a deadline), rewritten goals with a named
      owner and an exact date, the seven-line block with its rule, and a red-team pass where one objection
      survives on calendar evidence and one fails because the program was six days old with no log. That
      red-team is the strongest evidence. The 66-day review is scheduled but unrun, so the keep-or-drop
      outcome does not exist yet.'
  average: 7.67
  rationale: Goals a stranger can check, from a frozen 0 of 9 baseline to a keep-or-drop rule fixed early
  featured: true
- slug: pmbok8-program-recovery-simulator
  axis_scores:
    technical_depth: 9
    voice: 6
    validation: 8
  axis_reasoning:
    technical_depth: 'Widest running-artifact surface in the lens: three GitHub Projects views by audience,
      Linear, a scenario data pack, seven PMBOK 8 domains, formal change control, a reviewed charter,
      an EMV risk register, stakeholder matrix, RACI, a Chart.js dashboard with SPI analysis, a five-slide
      HTML deck with Web Speech API narration, and a GitHub Actions daily report. The LR diagram names
      real teams and real causes (velocity 24 to 8 to 2, team lead lost, ArtForge vendor late). Held at
      9 because the EMV figures and the Actions workflow are described, not shown.'
    voice: Competent PM report prose that restates outcomes in consultant register ('transformed raw project
      data into decision-support tools', 'reinforced the importance of evidence-based decision-making').
      Concrete lines exist (structural delivery failure rather than a productivity issue; recovery depends
      on leadership replacement and vendor escalation, not more effort) and one section loses its Triage
      Board heading mid-list. No banned verbs, but more filler than any other system here.
    validation: 'Each of nine phases carries a screenshot with concrete numbers: the Leviathan velocity
      trend, the SPI verdict naming Leviathan and Shiva as critical, the Odin scope-reduction decision,
      and the Director''s approved-with-conditions verdict with its three named conditions. The Actions
      automation was debugged through permissions and YAML. Strongest evidence chain in the set; not a
      10 because the EMV result itself is not shown.'
  average: 7.67
  rationale: EMV risk register and SPI analysis behind an approved recovery verdict
  featured: true
- slug: three-scheduled-email-checks
  axis_scores:
    technical_depth: 5
    voice: 9
    validation: 8
  axis_reasoning:
    technical_depth: 'A measurement protocol rather than a build: one page, three calendar events and a
      tally. What carries it is the boundary design. Urgent channels are enumerated and left on for all 66
      days, exactly one notification path is declared eligible, and SERIOUS is defined up front as missing
      an urgent work request, so a lower email count can never be bought with a missed message. Held at 5
      because nothing is constructed and the tooling is three consumer applications.'
    voice: 'The register counts against itself wherever it could have counted for itself. Two unscheduled
      checks in week 2 are recorded rather than excused as exceptions, which raises the treatment number
      and is the only way the comparison stays honest. The cost is kept in words so no second score can
      compete with the single measure. The coordinated switch is named as a limit on the claim: because
      every element started on one day, the result describes the routine and cannot say which part caused
      the change.'
    validation: 'The only one of the seven with a measured result, and it earns it. The baseline was marked
      live at the moment of each check rather than reconstructed afterwards from history or memory. The
      break list was completed before either week was counted, so the size of the reduction could not
      shade how the costs were remembered, and it resolved two prewritten predictions with one occurring
      and one not. The day 66 verdict applied the branch written on day 1 to reach KEEP with no new metric,
      no recalculated formula and no cutoff invented on the day.'
  average: 7.33
  rationale: A DROP of 37 against a branch written on day one, with both unscheduled checks counted in
  featured: false
- slug: block-agreement-before-booking
  axis_scores:
    technical_depth: 6
    voice: 9
    validation: 6
  axis_reasoning:
    technical_depth: 'A page and a calendar, but the control design is the richest of the six planning
      systems. Exceptions run at two levels: one standing rule that anything genuinely urgent is always
      taken, listed or not, and two named per-person conditions written identically in two places so a
      later proposal cannot widen or narrow either. The proposal carries an explicit status, the response
      branches are specified before any answer arrives, and partial agreement has its own defined handling
      rather than being resolved in the moment.'
    voice: 'It refuses the thing that would have been easiest: putting the Block on the calendar. The page
      states that a recurring event visible on one calendar would imply a reduction in access nobody
      consented to, and the calendar was checked and confirmed empty so both tools tell the same story. A
      second No stops the tally entirely rather than earning another ask. The sharpest line separates a
      good human decision from a successful focus session, so a real emergency is taken and the Block is
      still marked BROKEN rather than excused into looking intact.'
    validation: 'The edge cases were classified before the tally existed, which is what stops an awkward
      case being reclassified later to protect the count, and the calendar-empty check was actually
      performed rather than asserted. Held at 6 because no Block has run: there is no tally, no intact
      count and no verdict, so what exists is a well-specified method and not yet evidence.'
  average: 7.0
  rationale: Refuses to book the calendar until the people losing access say yes, with a second No ending it
  featured: false
- slug: open-item-routing-protocol
  axis_scores:
    technical_depth: 7
    voice: 8
    validation: 6
  axis_reasoning:
    technical_depth: 'One Notion page against Gmail, Google Calendar and a phone reminder, which is the
      same runtime as its two siblings and scored the same. What it adds is a four-route classifier that
      is exhaustive by construction, so nothing can be set down undecided, plus a completeness predicate
      on the deferral: a GIVE IT A DAY entry is incomplete until the DAY field names a specific day, with
      later and soon failing the rule and an unknown action day falling back to the next decision day
      rather than to a vague one. The strongest piece of design is procedural rather than technical: two
      deferral counts kept deliberately apart, only one of which is allowed to decide. Held at 7 because
      the runtime is still a page and an inbox, with no code and nothing executable.'
    voice: 'The highest first-person density in the lens, 46 uses of I across 1,678 words, and it spends
      that voice on limits rather than results. The setup count is labelled setup evidence and told
      plainly that it cannot decide the habit. The assistant proposes and never decides, and no agreement
      rate exists because a second metric would compete with the one that matters. The first-week note is
      kept qualitative on purpose, with no counts, rates, scores or minutes, and names what was given up:
      quick inbox scans, and leaving messages open as reminders. Naming retail promotions, listing alerts
      and trading newsletters as the items it most wanted to skim is the most honest line in the lens. One
      below the top because the four-route rule and the named-day rule are each restated three times
      across phases one, three and six.'
    validation: 'What is proven is real and bounded: 20 waiting items routed in one uninterrupted pass,
      selected as work that still needed judgment rather than as whatever was unread, every deferral
      rechecked afterwards against the named-day rule with none left incomplete, a setup deferral count
      recorded, and a cutoff of fewer than 10 fixed before any measurement. What is missing is the
      outcome. The review is scheduled, not reached, so the KEEP or DROP verdict does not exist yet and
      the doc says so. Scored 6, the same as daily-work-catalogue and for the same reason: a precommitted
      test with no result is a complete setup rather than a finished validation.'
  average: 7.0
  rationale: Four routes decided while the item is open, with the setup count barred from deciding it
  featured: false
- slug: daily-work-catalogue
  axis_scores:
    technical_depth: 7
    voice: 8
    validation: 6
  axis_reasoning:
    technical_depth: 'Same shape as its sibling stranger-checkable-goals and scored the same: one Notion
      page plus Google Calendar, across seven phases. What it adds is a live daily loop with a real data
      flow: a source map where every arrival channel (Gmail, Slack, Notion, Calendar, meetings, calls,
      in-person, paper) carries exactly one rule (I VISIT IT at a written time, or CAN REACH ME under
      a named condition) so no unlisted channel can bypass the queue; a pointer schema (one imperative
      sentence plus It stays in... plus a locator) with a self-check that a paragraph-length pointer is
      evidence of copied source; a rebuild cue tied to the end of the 9:15 Daily Scrum, chosen because
      it is present on working days, absent on rest days, and needs no dismissable reminder; an end-of-queue
      rule for ordinary arrivals with a narrow safety exception logged under DATE, WHAT ARRIVED, WHERE
      IT STAYS; and a setup cost recorded before day one. The diagram names all of it and carries the
      reasoning on its edges. Held at 7 because it is still one page, the review horizon is never dated
      (the sibling fixed 66 days), adherence has no numeric threshold, and the review that would close
      the loop has not run.'
    voice: 'The same disciplined first-person register as the sibling, with lines that carry the design:
      ''their timing did not establish priority'', ''a centralized catalogue did not require centralized
      content'', ''prevented ordinary urgency from borrowing the language of safety while preserving a
      route for genuine harm''. It bounds its own claims (the system does not prevent every interruption
      or replace professional judgment; professional, legal and workplace rules stay above it). No banned
      verbs, no dashes. One below the sibling because the end-of-queue rule and the safety exception are
      each restated three times across phases 4, 5 and 7, the pointer format twice, and the reflections
      restate the whole system a fourth time, so each paragraph carries less new information than the
      goals page does.'
    validation: 'Five of seven phases carry a screenshot; the precommitted review (phase 6) has none,
      and the only numbers on the page are the setup cost (a five-minute sweep, page repair heavier than
      the sweep, a displaced gym block) and the scrum and visit times. The busy-day audit is the system''s
      own test and it did run: direct messages, meeting requests and spoken asks each got one pointer
      at the end and work resumed, with a screenshot, but no count of arrivals, no date, and no queue-order
      record is reported. The exception log is stated blank, which is a result. The review is scheduled
      but its date is not on the page and it has not run, so the keep, revise or drop outcome does not
      exist yet. A partial chain, one step below the sibling''s numeric 0 of 9 baseline and its evidence-decided
      red team.'
  average: 7.0
  rationale: One rule per arrival channel, a pointer-only queue, and a safety exception that must be logged
  featured: false
- slug: stanford-decision-quality-simulator
  axis_scores:
    technical_depth: 7
    voice: 7
    validation: 7
  axis_reasoning:
    technical_depth: 'A layered decision engine: three personas (Coach, Skeptic, Operator) over six project
      files, a six-element DQ scorer with a weakest-link gate that caps the total, a seven-rule Pfeffer
      overlay that resequences execution, a board governance gate, and a transfer loop. The diagram carries
      real data on its edges (weakest = Frame at 75, PARTNER-to-BUILD with resequenced comms). It produces
      analysis rather than tooling, and the six project files are counted but not itemized.'
    voice: Framework-precise with real teaching lines ('a 95 across most dimensions still collapses operationally',
      'governance not as bureaucracy but as another quality filter'). Much of the connective tissue is
      third-person present ('The simulation introduces', 'This step transforms') which reads as course
      narration rather than owned decisions, so it stays at 7.
    validation: Instinct recorded before analysis (PARTNER), a weakest-link score of 75 with Frame named
      lowest, the Leidos conflict-of-interest gap surfaced as the warm-up's weakest Information element,
      an instinct-vs-framework After-Action Review, and a second scenario run to test generalization,
      which is the strongest signal. The 7-day commitment lists deliverables but no outcome, and the second
      scenario reports patterns without a score.
  average: 7.0
  rationale: Weakest-link decision scoring with a power overlay, proven across two scenarios
  featured: false
- slug: evidence-backed-estimates
  axis_scores:
    technical_depth: 6
    voice: 8
    validation: 6
  axis_reasoning:
    technical_depth: 'A controlled comparison with its denominators specified in advance. Ten jobs are held
      in first-thought order so the odd and even split cannot be steered toward whichever tasks are easier
      to support, dates are added to both halves before any evidence trail is attached, and the two
      estimate formats differ in exactly one respect: three lines carrying a past-work trail against one
      line carrying a number. The counting rules handle the awkward cases explicitly, including that
      finishing exactly on the estimate counts as inside and that a job which never started is excluded
      because it produced no timing evidence.'
    voice: 'It reports the baseline being wrong as a finding rather than hiding it, noting that the page
      exposed patch nights and migration reviews running longer than memory had claimed, and calls that
      uncomfortable. The aim is stated narrowly as testing whether looking backward plans better than
      memory, not as estimating every job correctly. The typical-time check keeps the human in front of
      the model: the operator sorted the three actuals personally and the returned value had to match the
      middle before it could be trusted.'
    validation: 'The typical-time method was genuinely exercised on three supplied values and confirmed to
      return the middle rather than an average, which is the one piece of the system that has actually
      run. The patience rule is the strongest control: no partial gap may be computed, and the comparison
      waits until both groups hold 20 countable jobs so an early imbalance cannot decide it. Held at 6
      because the gap itself does not exist yet and neither method has been shown better.'
  average: 6.67
  rationale: Odd jobs carry a past-work trail, even jobs carry a number, and no partial gap may be read
  featured: false
- slug: standing-meeting-consent-check
  axis_scores:
    technical_depth: 5
    voice: 9
    validation: 6
  axis_reasoning:
    technical_depth: 'The lightest build of the seven: a private page, one calendar review and two clock
      readings per meeting. The design work sits in the sequencing and the consent mechanics rather than
      in any tooling. Four baseline meetings, then the note, then four standing meetings, with the order
      fixed before any timing so the phases cannot be swapped or the standing half moved once early
      numbers appear. One result number is defined in advance and its arithmetic tested on an example
      before a real row existed.'
    voice: 'Consent is handled better here than anywhere else in the lens. Permission to sit is written
      before standing is mentioned, in three separate places, and a refusal is stored as a single line
      with no name, no reason and no circumstances, so declining never has to be defended. Stopping the
      experiment after a refusal is framed as the safety rule working rather than the attempt failing. The
      page keeps two sentences that bound the whole build: it records how the meeting changed, and it
      cannot tell why it changed. The cited research is held apart as covering a different kind of meeting
      and settling nothing about this one.'
    validation: 'The page was audited against itself rather than assumed correct: the sitting-first wording
      confirmed in all three locations, every required line counted and confirmed under its length limit,
      the phase order verified, the example arithmetic repeated, and every sentence about results checked
      to confirm none predicts an outcome or asserts a cause. Held at 6 because no meeting has been timed,
      the note is unsent and the real rows are deliberately empty.'
  average: 6.67
  rationale: Sitting-first in three places, a refusal stored as one line, and no claim about why it changed
  featured: false
- slug: trigger-gap-comparison
  axis_scores:
    technical_depth: 6
    voice: 8
    validation: 6
  axis_reasoning:
    technical_depth: 'A clean single-variable comparison. Target dates go on all ten actions before any
      trigger is written, so the test is dates against dates plus a noticeable cue rather than scheduled
      work against unscheduled work, which is the confound most versions of this experiment fall into. The
      intention filter runs first and its four rejects are struck through rather than quietly removed, so
      the selection rule and the reason the list changed stay on the page. The collision check is the
      original piece: cues are judged by when they fire rather than how they read, which caught two
      pointing at the same moment after dinner.'
    voice: 'It states plainly that a personal comparison of five against five proves little beyond its own
      setting and cannot establish that triggers work for every task, person or workflow. Assistant
      proposals are refused on substance rather than style, one for naming no dependable event and one for
      assuming an object would be where it usually sits, with the operator keeping original wording
      wherever its cue was more reliable. The open question is named rather than closed: whether the cues
      stay attached to stable moments as the routine changes.'
    validation: 'The page was read top to bottom against a prediction of ten dated actions and no if-then
      text, and the gap definition, example block, value and cutoff sentence were each confirmed present
      and in order before treatment began. The collision check actually changed the design, which is the
      mark of a test that was run rather than described. Held at 6 because the day 7 reading is explicitly
      an observation that decides nothing, and the day 66 fresh gap, the only one judged against the
      cutoff, does not exist yet.'
  average: 6.67
  rationale: Dates on both halves first, then cues judged by when they fire, which caught two colliding
  featured: false
- slug: coaching-shift-protocol
  axis_scores:
    technical_depth: 7
    voice: 7
    validation: 6
  axis_reasoning:
    technical_depth: 'The vault is a real operating loop: six named folders (assessments/, sessions/,
      protocols/, transfer/, templates/, prompts/), three role-separated personas, a Self-ELI baseline
      feeding the 4-Step Shift Arc, an ICF scoring gate, and a 7-day transfer. The diagram names those
      components and edges. The source doc names the Shift Arc but never lists its four steps, and the
      ICF scoring mechanics are asserted rather than shown, so it sits at the low end of production shape.'
    voice: First-person and on-brand at its best ('advice closes exploration while powerful questions
      expand it', 'restraint is often more valuable than explanation'), with concrete moments such as
      the best-work question, the Level 4 baseline, and the 'Keep going' prompt. Each is wrapped in a
      generic sentence of the 'this transformed the interaction into a repeatable system' kind, which
      keeps it out of the 8-9 band.
    validation: Every phase has a screenshot and the live Marcus session produced a 9 of 10 ICF score,
      which is the strongest evidence. That score comes from a persona gate inside the same workspace,
      the Day 1 vs Day 3 progression is described without numbers, and the three calendared real conversations
      report one documented outcome, so the chain is partial.
  average: 6.67
  rationale: ICF-scored coaching sessions that carry into seven days of real conversations
  featured: false
- slug: weekly-protected-hour
  axis_scores:
    technical_depth: 5
    voice: 8
    validation: 6
  axis_reasoning:
    technical_depth: 'One recurring calendar hour, one page and one prewritten response. The design is
      small by intent: a broad delayed item is cut down to a single visible piece that one sitting can
      finish, so the reminder never arrives with an open question about scope attached. The supporting
      parts each aim at one failure mode, with a boundary sentence prepared before anyone competes for the
      time, a movement rule that keeps a displaced session inside the same week rather than letting it
      disappear, and a cost line left blank until after the fourth session.'
    voice: 'The baseline rule is the honest one rather than the flattering one: calendar silence counts as
      No, and the page states that an undocumented session may well have happened but the chosen evidence
      source cannot show it, so counting a silent week as Yes would shrink the neglect without support.
      The cost line is deliberately left empty to prevent an early judgment about what protecting the hour
      actually takes. The future of the appointment is reported as undecided rather than assumed to
      continue.'
    validation: 'The four-week baseline was gathered from one declared evidence source and recorded before
      the recurring event existed, which keeps earlier neglect separate from later sessions, and the
      shared-account check was performed rather than assumed so a working reminder could not be mistaken
      for a missing one. Held at 6 because the baseline is the only evidence that exists: no session has
      run, no week has been counted, and the frozen 3-of-4 cutoff has nothing yet to read.'
  average: 6.33
  rationale: Calendar silence counts as No, so the baseline is the harsher reading rather than the kind one
  featured: false
